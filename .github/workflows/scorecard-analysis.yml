name: Scorecard analysis

permissions:
  contents: read

on:
  push:

concurrency:
  group: scorecard-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard-analysis:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read # Lets Scorecard read issue metadata via the GraphQL API.
      pull-requests: read # Lets Scorecard read pull-request metadata via the GraphQL API.
      id-token: write # Lets Scorecard prove the published result's provenance.
      security-events: write # Uploads the generated Scorecard SARIF to Code Scanning.
      actions: read # Lets the SARIF upload read workflow run metadata on non-public repositories.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.visibility == 'public' }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Resolve code scanning availability
        id: scanning-availability
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ENABLED: ${{ vars.CODE_SCANNING_ENABLED }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.visibility' 2>/dev/null || echo unknown)"
          seat="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.advanced_security.status // "unknown"' 2>/dev/null || echo unknown)"
          enabled=false
          if [ "${visibility}" = "public" ] || [ "${seat}" = "enabled" ] || [ "${FORCE_ENABLED:-}" = "true" ]; then
            enabled=true
          fi
          echo "Code scanning availability: visibility=${visibility} seat=${seat} enabled=${enabled}"
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Upload SARIF to Code Scanning
        if: steps.scanning-availability.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: Report unavailable Code Scanning
        if: steps.scanning-availability.outputs.enabled != 'true'
        run: echo "::notice::Scorecard SARIF is retained as an artifact; Code Scanning ingestion is unavailable."
